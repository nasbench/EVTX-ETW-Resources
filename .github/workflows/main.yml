name: XML Manifests Converter

on:
  # Regenerate the CSVs when manifests or the converter scripts change on main
  push:
    branches: [ main ]
    paths:
      - "ETWProvidersManifests/**.xml"
      - "Scripts/**"
      - ".github/workflows/main.yml"
  # Dry run on pull requests: convert, never commit
  pull_request:
    paths:
      - "ETWProvidersManifests/**.xml"
      - "Scripts/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

concurrency:
  group: converter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pull requests run the scripts of the pull request, so this job gets a
  # read-only token that is not stored in the checkout.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The converters only use the standard library; pytest is for the tests
      - name: Install test dependencies
        run: python -m pip install -r Scripts/requirements-dev.txt
      - name: Run the unit tests
        run: python -m pytest Scripts/tests
      - name: Delete previous CSV entries
        run: rm -rf ETWEventsList/
      - name: Run the etw-to-csv converter
        run: python Scripts/etw-to-csv.py
      - name: Delete previous CSV entries for Stats Providers
        run: find ETWProvidersCSVs -type f -name '*.csv' -exec rm -f {} \;
      - name: Run the stats generator
        run: python Scripts/stats.py

  # Pushes and manual runs convert and commit the generated data
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The converters only use the standard library; pytest is for the tests
      - name: Install test dependencies
        run: python -m pip install -r Scripts/requirements-dev.txt
      - name: Run the unit tests
        run: python -m pytest Scripts/tests
      - name: Delete previous CSV entries
        run: rm -rf ETWEventsList/
      - name: Run the etw-to-csv converter
        run: python Scripts/etw-to-csv.py
      - name: Delete previous CSV entries for Stats Providers
        run: find ETWProvidersCSVs -type f -name '*.csv' -exec rm -f {} \;
      - name: Run the stats generator
        run: python Scripts/stats.py
      - name: Commit generated data
        run: |
          git config user.name 'Github Actions'
          git config user.email 'robot@noreply.github.com'
          git add --all
          if [ "$(git diff --cached --numstat | wc -l)" != "0" ]; then
            git commit -m "New converted CSV's generated by CICD"
            git push
          else
            echo "No new modifications were made since previous commit"
          fi
