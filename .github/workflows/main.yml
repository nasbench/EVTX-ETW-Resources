name: XML Manifests Converter

on:
  # Regenerate the CSVs when manifests or the converter scripts change on main
  push:
    branches: [ main ]
    paths:
      - "ETWProvidersManifests/**.xml"
      - "Scripts/**"
      - ".github/workflows/main.yml"
  # Dry run on pull requests: convert everything, never commit
  pull_request:
    paths:
      - "ETWProvidersManifests/**.xml"
      - "Scripts/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

concurrency:
  group: converter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Pull requests from forks get a read-only token regardless of this setting
    permissions:
      contents: write
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4
        with:
          # The converters diff against the previous commit to find what changed
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The converters only use the standard library; pytest is for the tests
      - name: Install test dependencies
        run: python -m pip install -r Scripts/requirements-dev.txt
      - name: Run the unit tests
        run: python -m pytest Scripts/tests
      - name: Decide what to regenerate
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Only the builds and providers that changed are regenerated, unless the
          # scripts or the workflow changed, the previous commit is unknown (new
          # branch, forced push) or the run was started by hand
          base=""
          if [ "$EVENT_NAME" = "push" ]; then base="$BEFORE"; fi
          if [ "$EVENT_NAME" = "pull_request" ]; then base="origin/$BASE_REF"; fi
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null \
             && git diff --quiet "$base" HEAD -- Scripts .github; then
            echo "changed_since=$base" >> "$GITHUB_OUTPUT"
            echo "Incremental run, changes since $base"
          else
            echo "changed_since=" >> "$GITHUB_OUTPUT"
            echo "Full run"
          fi
      - name: Delete previous CSV entries
        if: steps.scope.outputs.changed_since == ''
        run: |
          rm -rf ETWEventsList/
          find ETWProvidersCSVs -type f -name '*.csv' -exec rm -f {} \;
      - name: Run the etw-to-csv converter
        env:
          CHANGED_SINCE: ${{ steps.scope.outputs.changed_since }}
        run: python Scripts/etw-to-csv.py ${CHANGED_SINCE:+--changed-since "$CHANGED_SINCE"}
      - name: Run the stats generator
        env:
          CHANGED_SINCE: ${{ steps.scope.outputs.changed_since }}
        run: python Scripts/stats.py ${CHANGED_SINCE:+--changed-since "$CHANGED_SINCE"}
      - name: Commit generated data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'Github Actions'
          git config user.email 'robot@noreply.github.com'
          git add --all
          if [ "$(git diff --cached --numstat | wc -l)" != "0" ]; then
            git commit -m "New converted CSV's generated by CICD"
            git push
          else
            echo "No new modifications were made since previous commit"
          fi
